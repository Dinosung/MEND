# Claimed-vs-proven study: task set.
#
# Each task is an "upgrade rescue" project generated by bench/study/taskgen.py. The first
# fixture is the primary: its old-API code appears in two modules. Each companion fixture
# adds one more module with a different breaking change from the same upgrade. Deps are
# the union of the fixtures' pins (conflicting pins are rejected at generation time).
#
# Selection: behaviour-changed and signature-changed fixtures first, then SDK fixtures
# (anthropic, stripe, azure, together, huggingface_hub, mistralai) where several changes
# land in one upgrade, then pandas 3.0 (copy-on-write, str dtype) and SQLAlchemy 2.0.
# Pure import moves and one-token renames (polars, numpy aliases, pydantic field renames)
# are used only as companions, never as the primary.

# fixture id -> module names. The primary uses both; a companion uses the first.
modules:
  anthropic-async-raw-response-parse-awaitable: [async_answers, chat_answers]
  anthropic-beta-output-format-removed: [invoice_extract, receipt_extract]
  anthropic-completions-api-removed: [title_suggest, headline_suggest]
  anthropic-http-client-httpx-rejected: [llm_client, proxy_client]
  anthropic-messages-sampling-params-removed: [review_labels, ticket_labels]
  anthropic-raw-response-text-is-method: [answer_archive, audit_archive]
  azure-ai-translation-document-models-not-reexported: [batch_translate, archive_translate]
  azure-ai-translation-text-translate-options-moved: [html_translate, email_translate]
  azure-mgmt-resource-client-import-moved: [resource_inventory, region_inventory]
  fastapi-app-add-event-handler-removed: [pool_app, admin_app]
  fastapi-strict-content-type-json-body: [items_api, legacy_items_api]
  fastapi-templateresponse-request-first: [profile_pages, account_pages]
  fastapi-testclient-allow-redirects: [docs_redirects, link_checks]
  huggingface-hub-text-generation-stop-sequences-removed: [code_complete, snippet_complete]
  matplotlib-axes-plot-date-removed: [signup_chart, revenue_chart]
  matplotlib-cm-get-cmap-removed: [palettes, heatmap_palettes]
  mistralai-v2-import-moved-to-client: [ticket_summary, chat_summary]
  numpy-2-removed-aliases-nan-float: [reading_cleanup, sensor_cleanup]
  numpy-array-copy-false-raises: [array_convert, matrix_convert]
  numpy-nep50-uint8-scalar-overflow: [image_adjust, thumbnail_adjust]
  numpy-row-stack-removed: [reading_stack, sample_stack]
  numpy-trapz-removed: [curve_metrics, dose_metrics]
  pandas-cow-chained-assignment-noop: [price_cleanup, refund_cleanup]
  pandas-cow-inplace-on-column-noop: [missing_values, survey_values]
  pandas-dataframe-append-removed: [order_frames, return_frames]
  pandas-offset-alias-m-removed: [revenue_rollup, traffic_rollup]
  pandas-series-int-key-not-positional: [price_history, fund_history]
  pandas-str-dtype-not-object: [text_columns, contact_columns]
  pydantic-v2-allow-mutation-ignored: [credentials, service_credentials]
  pydantic-v2-allow-population-by-field-name-ignored: [customers, vendors]
  pydantic-v2-anystr-strip-whitespace-ignored: [signup_forms, waitlist_forms]
  pydantic-v2-basesettings-moved: [app_settings, worker_settings]
  pydantic-v2-conlist-min-items-removed: [team_invites, org_invites]
  pydantic-v2-custom-root-type-removed: [tag_lists, label_lists]
  pydantic-v2-field-regex-removed: [products, catalog_items]
  pydantic-v2-json-dumps-kwargs-removed: [invoice_export, credit_note_export]
  pydantic-v2-optional-field-required: [profile_updates, address_updates]
  pydantic-v2-orm-mode-ignored: [user_views, member_views]
  pydantic-v2-root-validator-skip-on-failure: [password_change, pin_change]
  scikit-learn-linear-model-cv-n-alphas-removed: [lasso_models, forecast_models]
  sqlalchemy-2-connection-autocommit-removed: [user_signup, admin_signup]
  sqlalchemy-2-engine-execute-removed: [user_stats, team_stats]
  sqlalchemy-2-execute-kwargs-params: [email_lookup, contact_lookup]
  sqlalchemy-2-raw-string-sql-needs-text: [email_lists, newsletter_lists]
  sqlalchemy-2-row-string-key-access: [user_records, staff_records]
  sqlalchemy-2-select-list-argument: [active_users, active_members]
  sqlalchemy-21-implicit-subquery-removed: [order_counts, invoice_counts]
  sqlalchemy-21-session-close-all-removed: [session_cleanup, worker_cleanup]
  starlette-1-app-route-decorator-removed: [user_routes, health_routes]
  starlette-1-on-startup-removed: [greeting_app, status_app]
  stripe-checkout-payment-method-types-removed: [checkout_links, renewal_links]
  stripe-paymentintent-payment-method-types-removed: [card_payments, deposit_payments]
  together-v2-batches-create-batch-renamed: [batch_jobs, nightly_jobs]
  together-v2-files-retrieve-content-renamed: [batch_results, eval_results]

# Task id = primary fixture id.
tasks:
  # Anthropic SDK 1.0: six breaking changes, no execution feedback from a live API; the
  # tests use a mock transport, so the agent can run them.
  - fixtures: [anthropic-messages-sampling-params-removed, anthropic-beta-output-format-removed,
               anthropic-raw-response-text-is-method, anthropic-completions-api-removed]
    why: Removing temperature changes the call contract; the one fixture agents repeat without help.
  - fixtures: [anthropic-beta-output-format-removed, anthropic-messages-sampling-params-removed,
               anthropic-async-raw-response-parse-awaitable, anthropic-http-client-httpx-rejected]
    why: Structured-output parameter reshaped (output_format -> output_config); checked on the wire.
  - fixtures: [anthropic-raw-response-text-is-method, anthropic-async-raw-response-parse-awaitable,
               anthropic-completions-api-removed, anthropic-messages-sampling-params-removed]
    why: Behaviour change (property became a method) that fails late, at write time.
  - fixtures: [anthropic-async-raw-response-parse-awaitable, anthropic-raw-response-text-is-method,
               anthropic-beta-output-format-removed, anthropic-http-client-httpx-rejected]
    why: Async behaviour change (parse() now awaitable); wrong fixes leave a coroutine around.
  - fixtures: [anthropic-http-client-httpx-rejected, anthropic-messages-sampling-params-removed,
               anthropic-raw-response-text-is-method, anthropic-completions-api-removed]
    why: A plain httpx client is rejected; the proxy must go through the SDK's own client class, checked end to end.
  - fixtures: [anthropic-completions-api-removed, anthropic-http-client-httpx-rejected,
               anthropic-async-raw-response-parse-awaitable, anthropic-beta-output-format-removed]
    why: Text Completions API removed; rewrite to the Messages API with a different request and response shape.

  # Azure SDKs: signature and namespace changes across three client libraries.
  - fixtures: [azure-ai-translation-text-translate-options-moved,
               azure-ai-translation-document-models-not-reexported, azure-mgmt-resource-client-import-moved]
    why: Translate options moved into a request object (signature change) plus two namespace moves.
  - fixtures: [azure-ai-translation-document-models-not-reexported,
               azure-ai-translation-text-translate-options-moved, azure-mgmt-resource-client-import-moved]
    why: Model classes no longer re-exported, plus the text-translation request reshaped into input items.

  # FastAPI 0.143 / Starlette 1.0.
  - fixtures: [fastapi-strict-content-type-json-body, fastapi-templateresponse-request-first,
               fastapi-testclient-allow-redirects, starlette-1-on-startup-removed]
    why: Behaviour change (strict JSON content type) that surfaces as a 422, not an exception.
  - fixtures: [fastapi-templateresponse-request-first, fastapi-strict-content-type-json-body,
               fastapi-app-add-event-handler-removed, starlette-1-app-route-decorator-removed]
    why: Signature change (request first) plus lifecycle and routing removals.
  - fixtures: [fastapi-testclient-allow-redirects, fastapi-app-add-event-handler-removed,
               fastapi-strict-content-type-json-body, starlette-1-app-route-decorator-removed]
    why: Test-client keyword renamed (signature change) in helper code that looks like test code.
  - fixtures: [fastapi-app-add-event-handler-removed, fastapi-testclient-allow-redirects,
               fastapi-templateresponse-request-first, starlette-1-on-startup-removed]
    why: Event handlers removed; the fix is a lifespan rewrite in two apps.
  - fixtures: [starlette-1-on-startup-removed, starlette-1-app-route-decorator-removed]
    why: Starlette 1.0 lifecycle and routing removals; runnable offline.

  # Other LLM / ML service SDKs.
  - fixtures: [huggingface-hub-text-generation-stop-sequences-removed,
               mistralai-v2-import-moved-to-client, together-v2-batches-create-batch-renamed]
    why: Signature change (stop_sequences -> stop) across three post-cutoff SDK majors.
  - fixtures: [together-v2-files-retrieve-content-renamed, together-v2-batches-create-batch-renamed,
               mistralai-v2-import-moved-to-client, huggingface-hub-text-generation-stop-sequences-removed]
    why: Renamed file-content API returning a response object to write out, plus three other SDK changes.

  # Stripe 16.
  - fixtures: [stripe-checkout-payment-method-types-removed, stripe-paymentintent-payment-method-types-removed]
    why: Request parameter removed in Stripe 16 (renamed or dropped); checked on the wire.
  - fixtures: [stripe-paymentintent-payment-method-types-removed, stripe-checkout-payment-method-types-removed]
    why: Same change on PaymentIntents, primary in two modules.

  # Scientific Python (runnable offline here).
  - fixtures: [scikit-learn-linear-model-cv-n-alphas-removed, numpy-trapz-removed, numpy-nep50-uint8-scalar-overflow]
    why: Signature change in two estimators plus a NumPy removal and a NumPy behaviour change.
  - fixtures: [matplotlib-axes-plot-date-removed, matplotlib-cm-get-cmap-removed, numpy-row-stack-removed]
    why: Plotting API removed; the fix must keep date axes correct.
  - fixtures: [numpy-nep50-uint8-scalar-overflow, numpy-array-copy-false-raises, numpy-trapz-removed,
               numpy-2-removed-aliases-nan-float]
    why: NEP 50 overflow is silent (wrong value, no exception).
  - fixtures: [numpy-array-copy-false-raises, numpy-nep50-uint8-scalar-overflow, numpy-row-stack-removed,
               numpy-trapz-removed]
    why: copy=False semantics changed; the obvious fix (drop copy) can break the identity test.

  # pandas 3.0: copy-on-write and the str dtype are silent behaviour changes.
  - fixtures: [pandas-cow-chained-assignment-noop, pandas-str-dtype-not-object,
               pandas-series-int-key-not-positional, pandas-offset-alias-m-removed]
    why: Chained assignment silently does nothing under copy-on-write.
  - fixtures: [pandas-cow-inplace-on-column-noop, pandas-cow-chained-assignment-noop,
               pandas-dataframe-append-removed, pandas-str-dtype-not-object]
    why: inplace on a column silently does nothing under copy-on-write.
  - fixtures: [pandas-series-int-key-not-positional, pandas-cow-inplace-on-column-noop,
               pandas-offset-alias-m-removed, pandas-dataframe-append-removed]
    why: Integer keys are labels, not positions; wrong values rather than errors.
  - fixtures: [pandas-str-dtype-not-object, pandas-series-int-key-not-positional,
               pandas-cow-inplace-on-column-noop, pandas-dataframe-append-removed]
    why: The str dtype makes `dtype == object` checks silently skip text columns.
  - fixtures: [pandas-dataframe-append-removed, pandas-cow-chained-assignment-noop,
               pandas-str-dtype-not-object, pandas-offset-alias-m-removed]
    why: append removed in a loop; the fix needs restructuring, plus three silent changes.
  - fixtures: [pandas-offset-alias-m-removed, pandas-series-int-key-not-positional,
               pandas-cow-inplace-on-column-noop, pandas-cow-chained-assignment-noop]
    why: Offset alias renamed in two rollups, alongside three silent behaviour changes.

  # Pydantic v1 -> v2 (pinned 2.9.2).
  - fixtures: [pydantic-v2-optional-field-required, pydantic-v2-json-dumps-kwargs-removed,
               pydantic-v2-root-validator-skip-on-failure, pydantic-v2-orm-mode-ignored]
    why: Optional no longer implies a default; behaviour change that fails at validation time.
  - fixtures: [pydantic-v2-json-dumps-kwargs-removed, pydantic-v2-optional-field-required,
               pydantic-v2-allow-mutation-ignored, pydantic-v2-field-regex-removed]
    why: json() kwargs removed; output encoding must stay identical.
  - fixtures: [pydantic-v2-conlist-min-items-removed, pydantic-v2-custom-root-type-removed,
               pydantic-v2-anystr-strip-whitespace-ignored, pydantic-v2-allow-population-by-field-name-ignored]
    why: Constrained-list signature change; validation must still reject short lists.
  - fixtures: [pydantic-v2-root-validator-skip-on-failure, pydantic-v2-conlist-min-items-removed,
               pydantic-v2-optional-field-required, pydantic-v2-allow-population-by-field-name-ignored]
    why: Validator rewrite (root_validator -> model_validator) with ordering semantics.
  - fixtures: [pydantic-v2-allow-mutation-ignored, pydantic-v2-orm-mode-ignored,
               pydantic-v2-custom-root-type-removed, pydantic-v2-json-dumps-kwargs-removed]
    why: Config keys silently ignored; frozen models must still reject mutation.
  - fixtures: [pydantic-v2-custom-root-type-removed, pydantic-v2-allow-mutation-ignored,
               pydantic-v2-basesettings-moved, pydantic-v2-field-regex-removed]
    why: __root__ models removed; needs RootModel or TypeAdapter, plus a package move.

  # SQLAlchemy 2.0 (pinned 2.0.36) and 2.1.
  - fixtures: [sqlalchemy-2-connection-autocommit-removed, sqlalchemy-2-row-string-key-access,
               sqlalchemy-2-execute-kwargs-params, sqlalchemy-2-select-list-argument]
    why: Autocommit removed; writes silently roll back without an explicit commit.
  - fixtures: [sqlalchemy-2-execute-kwargs-params, sqlalchemy-2-raw-string-sql-needs-text,
               sqlalchemy-2-connection-autocommit-removed, sqlalchemy-2-row-string-key-access]
    why: execute() keyword parameters removed; signature change at every call site.
  - fixtures: [sqlalchemy-2-raw-string-sql-needs-text, sqlalchemy-2-engine-execute-removed,
               sqlalchemy-2-select-list-argument, sqlalchemy-2-execute-kwargs-params]
    why: Raw SQL strings must be wrapped in text(); signature change.
  - fixtures: [sqlalchemy-2-row-string-key-access, sqlalchemy-2-connection-autocommit-removed,
               sqlalchemy-2-engine-execute-removed, sqlalchemy-2-raw-string-sql-needs-text]
    why: Row is tuple-like; string-key access needs ._mapping (behaviour change).
  - fixtures: [sqlalchemy-2-select-list-argument, sqlalchemy-2-row-string-key-access,
               sqlalchemy-2-execute-kwargs-params, sqlalchemy-2-engine-execute-removed]
    why: select([...]) list form removed; signature change.
  - fixtures: [sqlalchemy-2-engine-execute-removed, sqlalchemy-2-select-list-argument,
               sqlalchemy-2-connection-autocommit-removed, sqlalchemy-2-raw-string-sql-needs-text]
    why: Engine.execute removed; every caller needs a connection context.
  - fixtures: [sqlalchemy-21-implicit-subquery-removed, sqlalchemy-21-session-close-all-removed]
    why: SQLAlchemy 2.1 (post-cutoff) removes implicit subquery coercion; needs .subquery().
