# MEND-Bench v2 pilot config. Read by `python -m bench.v2.run --config bench/v2/run-config.yaml`
# and by .github/workflows/bench-v2.yml on pushes to bench-run/** branches.
#
# Budget: the owner's cap is $5 for ALL benchmark runs combined. Set prior_spend_usd to the
# sum of `spend_usd` from earlier runs' summary.json before starting another one.
agent: claude_code
model: claude-haiku-5-5
# Fresh pilot: 11 breaking changes released 2026-06 to 2026-10.
fixtures:
  - anthropic-messages-sampling-params-removed
  - anthropic-completions-api-removed
  - anthropic-beta-output-format-removed
  - polars-melt-removed
  - polars-parquet-allow-missing-columns-removed
  - sqlalchemy-21-session-close-all-removed
  - sqlalchemy-21-implicit-subquery-removed
  - matplotlib-cm-get-cmap-removed
  - matplotlib-axes-plot-date-removed
  - scikit-learn-linear-model-cv-n-alphas-removed
  - numpy-row-stack-removed
arms: [A0, A1, A4]
trials: 3              # 11 fixtures x 3 arms x 3 = 99 trials
max_turns: 12
per_trial_usd: 0.10    # passed to claude --max-budget-usd; charged in full if a trial reports no cost
run_usd: 0.75          # this run stops launching trials before exceeding this
max_usd: 5.0           # overall cap across runs
prior_spend_usd: 1.11
max_trials: 300
scorer: uv
