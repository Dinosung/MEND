# MEND-Bench v2 pilot config. Read by `python -m bench.v2.run --config bench/v2/run-config.yaml`
# and by .github/workflows/bench-v2.yml on pushes to bench-run/** branches.
#
# Budget: the owner's cap is $5 for ALL benchmark runs combined. Set prior_spend_usd to the
# sum of `spend_usd` from earlier runs' summary.json before starting another one.
agent: claude_code
model: claude-haiku-5-5
# Diagnosis: the one fresh fixture with baseline failures.
fixtures:
  - anthropic-messages-sampling-params-removed
arms: [A0, A1, A4]
trials: 5              # 1 fixture x 3 arms x 5 = 15 trials
max_turns: 12
per_trial_usd: 0.10    # passed to claude --max-budget-usd; charged in full if a trial reports no cost
run_usd: 0.30          # this run stops launching trials before exceeding this
max_usd: 5.0           # overall cap across runs
prior_spend_usd: 1.75
max_trials: 300
scorer: uv
