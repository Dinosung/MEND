# MEND-Bench v2 pilot config. Read by `python -m bench.v2.run --config bench/v2/run-config.yaml`
# and by .github/workflows/bench-v2.yml on pushes to bench-run/** branches.
#
# Budget: the owner's cap is $5 for ALL benchmark runs combined. Set prior_spend_usd to the
# sum of `spend_usd` from earlier runs' summary.json before starting another one.
agent: claude_code
model: claude-opus-5-5
# Opus screen: 17 SDK fixtures, no help, 1 trial: which still fool Opus?
fixtures:
  - anthropic-async-raw-response-parse-awaitable
  - anthropic-beta-output-format-removed
  - anthropic-completions-api-removed
  - anthropic-http-client-httpx-rejected
  - anthropic-messages-sampling-params-removed
  - anthropic-raw-response-text-is-method
  - azure-ai-translation-document-models-not-reexported
  - azure-ai-translation-text-translate-options-moved
  - azure-mgmt-resource-client-import-moved
  - azure-mgmt-resource-subscriptionclient-moved
  - huggingface-hub-text-generation-stop-sequences-removed
  - mistralai-v2-import-moved-to-client
  - stripe-checkout-payment-method-types-removed
  - stripe-object-get-removed
  - stripe-paymentintent-payment-method-types-removed
  - together-v2-batches-create-batch-renamed
  - together-v2-files-retrieve-content-renamed
arms: [A0]
trials: 1              # 17 fixtures x 1 arm x 1 = 17 trials
max_turns: 12
per_trial_usd: 0.40    # passed to claude --max-budget-usd; charged in full if a trial reports no cost
run_usd: 1.50          # this run stops launching trials before exceeding this
max_usd: 5.0           # overall cap across runs
prior_spend_usd: 1.88
max_trials: 300
scorer: uv
