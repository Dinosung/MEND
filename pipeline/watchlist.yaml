# Considered and skipped:
#   httpx      - no stable release since 0.28.1 (2024-12); 1.0 only as 2021 beta tag.
#   requests   - 2.33/2.34 (2026-03/05) are minor, no public API removals worth diffing.
#   typer      - 0.2x minors; small API; candidate for a later batch.
#   celery     - 5.6.0 (2025-11-30); mostly behaviour/config changes, not signature-level.
#   boto3      - too large / generated clients; out of scope for static diffing.
