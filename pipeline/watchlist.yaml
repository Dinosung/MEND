# MEND release-diff watchlist (pipeline stage "Detect").
#
# Libraries agents use heavily that shipped major/minor releases with breaking
# changes between Oct 2025 and Oct 2026. Dates are the tag commit dates from the
# upstream repos (git), checked 2026-10-14.
#
# Per library:
#   repo               git URL (cloned shallow/sparse/blob-less; never executed)
#   tag_pattern        regex matching release tags (for the future RSS/tag poller)
#   packages           import names to diff
#   src_root           repo dir containing the package; src_root_overrides per tag
#   changelog          repo paths (files or dirs) of release notes in the NEW tag, used
#                      to corroborate candidates (changelog_mentions)
#   hot_symbols        names agents use a lot; candidates touching them rank higher
#   internal_segments  extra module names treated as non-public
#   releases           old -> new tag pairs to diff (old = last patch of the previous
#                      minor released before `new`)

libraries:
  - name: numpy
    repo: https://github.com/numpy/numpy
    tag_pattern: '^v(\d+)\.(\d+)\.(\d+)$'
    packages: [numpy]
    src_root: .
    changelog: [doc/source/release/2.4.0-notes.rst, doc/source/release/2.5.0-notes.rst]
    hot_symbols: [array, asarray, ndarray, linspace, arange, zeros, ones, mean, sum, dot, matmul, where,
                  concatenate, stack, reshape, random, linalg, fft, unique, sort, argsort, clip, round,
                  trapezoid, isin, histogram, save, load, savetxt, loadtxt, fromstring, frombuffer, dtype]
    internal_segments: [core, _core, distutils, f2py, _pyinstaller, conftest]
    releases:
      - {old: v2.3.5, old_date: 2025-11-16, new: v2.4.0, new_date: 2025-12-20}
      - {old: v2.4.6, old_date: 2026-05-18, new: v2.5.0, new_date: 2026-06-21}

  - name: pandas
    repo: https://github.com/pandas-dev/pandas
    tag_pattern: '^v(\d+)\.(\d+)\.(\d+)$'
    packages: [pandas]
    src_root: .
    changelog: [doc/source/whatsnew/v3.0.0.rst]
    hot_symbols: [DataFrame, Series, read_csv, read_excel, read_json, read_parquet, to_csv, to_datetime,
                  concat, merge, groupby, pivot_table, apply, applymap, map, fillna, replace, astype,
                  to_dict, resample, rolling, date_range, Timestamp, Index, loc, iloc, value_counts,
                  sort_values, drop, read_sql, to_sql, melt, get_dummies, cut, qcut, api]
    internal_segments: [core, _libs, _config, io.formats, util]
    releases:
      - {old: v2.3.3, old_date: 2025-09-30, new: v3.0.0, new_date: 2026-01-21}

  - name: pydantic
    repo: https://github.com/pydantic/pydantic
    tag_pattern: '^v(\d+)\.(\d+)\.(\d+)$'
    packages: [pydantic]
    src_root: .
    changelog: [HISTORY.md]
    hot_symbols: [BaseModel, Field, field_validator, model_validator, ConfigDict, TypeAdapter, model_dump,
                  model_validate, model_dump_json, model_validate_json, computed_field, validate_call,
                  ValidationError, create_model, RootModel, dataclasses, AliasChoices, field_serializer]
    internal_segments: [v1, deprecated, plugin, experimental]
    releases:
      - {old: v2.12.5, old_date: 2025-11-26, new: v2.13.0, new_date: 2026-04-13}
      - {old: v2.13.5, old_date: 2026-08-28, new: v2.14.0, new_date: 2026-10-08}

  - name: fastapi
    repo: https://github.com/fastapi/fastapi
    tag_pattern: '^(\d+)\.(\d+)\.(\d+)$'
