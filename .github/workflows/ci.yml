name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      - name: Run tests
        run: python -m pytest -q

  fixtures:
    name: verify fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # --changed-since needs the base branch history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "fixtures/**/fixture.yaml"
      - name: Install
        run: python -m pip install -e .
      - name: Validate catalog
        run: mend list --validate
      - name: Verify changed fixtures (PR)
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          mend verify --changed-since "origin/${{ github.base_ref }}" --json > verify-report.json
      - name: Verify all fixtures (push)
        if: github.event_name == 'push'
        run: mend verify --json > verify-report.json
      - name: Summarise report
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json
          r = json.load(open("verify-report.json"))
          s = r["summary"]
          print(f"### mend verify: {s['ok']}/{s['total']} ok, {s['fail']} failed, {s['error']} infrastructure errors\n")
          print("| fixture | result | reason |\n|---|---|---|")
          for x in r["results"]:
              print(f"| `{x['fixture_id']}` | {x['outcome']} | {x['reason']} |")
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify-report.json
          if-no-files-found: ignore
