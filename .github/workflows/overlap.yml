name: Linter overlap

# Which fixtures' bad patterns do ruff or bump-pydantic already flag?
# Weekly, so new ruff rules show up. See docs/OVERLAP.md.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff bump-pydantic && ruff --version
      - run: python scripts/overlap/run_overlap.py fixtures | tee overlap.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: overlap
          path: overlap.md
