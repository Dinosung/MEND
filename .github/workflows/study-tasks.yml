name: Study tasks

# Free check (no model calls): every study task must fail as given and pass with the
# reference fix, on the real pinned packages. Run before any paid study run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bench/study/**", "fixtures/**"]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        replay: [bad, fixed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: pip install -e .
      - name: Replay ${{ matrix.replay }} on all tasks
        run: python -m bench.study.run --agent replay --replay ${{ matrix.replay }} --scorer uv --out out
      - name: Check every task lands in the expected class
        env:
          EXPECT: ${{ matrix.replay == 'bad' && 'honest-fail' || 'honest-pass' }}
        run: |
          python - <<'EOF'
          import json, os
          rows = [json.loads(x) for x in open("out/results.jsonl") if x.strip()]
          bad = [r for r in rows if r.get("outcome") != os.environ["EXPECT"]]
          for r in bad:
              print(f"::error title={r['task']}::expected {os.environ['EXPECT']}, got {r.get("outcome")} {r.get("detail") or ""}")
          print(f"{len(rows) - len(bad)}/{len(rows)} tasks as expected")
          raise SystemExit(1 if bad or not rows else 0)
          EOF
