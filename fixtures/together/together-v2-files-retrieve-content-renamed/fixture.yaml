id: together-v2-files-retrieve-content-renamed
title: "Downloading a file with client.files.retrieve_content() in the together 2.0 SDK"
summary: >
  The together 2.0 SDK (a regenerated client) replaced files.retrieve_content(id, output=...)
  with files.content(id), which returns the binary response instead of writing a file; save
  it yourself (e.g. .write_to_file(path)). The old method no longer exists, so v1-style code
  fails with AttributeError. fine_tuning.download was likewise replaced by fine_tuning.content.
ecosystem: python
package: together
versions: ">=2.0.0"
tags: [llm, files, batch, download, migration]
failure:
  kind: api-renamed
  symptom: "AttributeError: 'FilesResource' object has no attribute 'retrieve_content'"
  bad_pattern: "client.files.retrieve_content(id=file_id, output=path)"
  fix_pattern: "client.files.content(file_id).write_to_file(path)"
repro:
  python: "3.13"
  deps: ["together==2.0.0", "httpx==0.28.1"]
  old_deps: ["together==1.5.35"]
provenance:
  sources:
    - {type: docs, url: "https://docs.together.ai/docs/pythonv2-migration-guide"}
    - {type: changelog, url: "https://github.com/togethercomputer/together-py/blob/v2.0.0/CHANGELOG.md"}
    - {type: other, url: "https://github.com/togethercomputer/together-python/blob/v1.5.35/src/together/resources/files.py"}
  license: "Apache-2.0"
  released: "2026-02-04"
status: verified
