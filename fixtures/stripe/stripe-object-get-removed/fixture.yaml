id: stripe-object-get-removed
title: "Calling .get() on a StripeObject (e.g. metadata) in stripe-python 15"
summary: >
  stripe-python 15.0 made StripeObject stop inheriting from dict, so dict methods such as
  .get(), .items() and .keys() no longer exist on API objects or on nested fields like
  metadata. obj.get("key") now raises AttributeError; use getattr(obj, "key", None),
  `"key" in obj` with obj["key"], or obj.to_dict().get("key").
ecosystem: python
package: stripe
versions: ">=15.0.0"
tags: [payments, api-client, dict, migration]
failure:
  kind: api-removed
  symptom: "AttributeError: get"
  bad_pattern: "session.metadata.get(\"order_id\")"
  fix_pattern: "getattr(session.metadata, \"order_id\", None)  # or session.metadata.to_dict().get(\"order_id\")"
repro:
  python: "3.13"
  deps: ["stripe==15.0.0", "requests==2.32.5", "typing_extensions==4.15.0"]
  old_deps: ["stripe==14.4.1", "requests==2.32.5", "typing_extensions==4.15.0"]
provenance:
  sources:
    - {type: changelog, url: "https://github.com/stripe/stripe-python/blob/v15.0.0/CHANGELOG.md"}
    - {type: pr, url: "https://github.com/stripe/stripe-python/pull/1762"}
    - {type: docs, url: "https://github.com/stripe/stripe-python/wiki/Migration-guide-for-v15"}
  license: "MIT"
  released: "2026-03-25"
status: verified
