id: sqlalchemy-2-execute-kwargs-params
title: "Passing bind parameters as keyword arguments to Connection.execute() in SQLAlchemy 2.0"
summary: >
  SQLAlchemy 2.0 removed the **kwargs form of Connection.execute(). Bind parameters must
  be passed as a single dictionary (or a list of dictionaries for executemany);
  conn.execute(stmt, id=1) raises TypeError.
ecosystem: python
package: sqlalchemy
versions: ">=2.0"
tags: [core, connection, parameters, migration]
failure:
  kind: signature-changed
  symptom: "TypeError: Connection.execute() got an unexpected keyword argument 'id'"
  bad_pattern: "conn.execute(text(\"... WHERE id = :id\"), id=user_id)"
  fix_pattern: "conn.execute(text(\"... WHERE id = :id\"), {\"id\": user_id})"
repro:
  python: "3.13"
  deps: ["sqlalchemy==2.0.36"]
  old_python: "3.12"
  old_deps: ["sqlalchemy==1.4.54"]
provenance:
  sources:
    - {type: docs, url: "https://docs.sqlalchemy.org/en/20/changelog/migration_20.html#execute-method-more-strict-execution-options-are-more-prominent"}
  license: "MIT"
  released: "2023-01-26"
status: verified
