id: anthropic-async-raw-response-parse-awaitable
title: "Calling .parse() without await on an async with_raw_response result in anthropic 1.0"
summary: >
  anthropic 1.0 made .with_raw_response return the same APIResponse / AsyncAPIResponse classes
  as .with_streaming_response instead of LegacyAPIResponse. On the async client, parse(),
  read(), text() and json() are now coroutines, so `raw.parse()` without await yields a
  coroutine and the next attribute access fails. Header access is unchanged.
ecosystem: python
package: anthropic
versions: ">=1.0.0"
tags: [llm, async, raw-response, headers, migration]
failure:
  kind: behavior-changed
  symptom: "AttributeError: 'coroutine' object has no attribute 'content' (RuntimeWarning: coroutine 'AsyncAPIResponse.parse' was never awaited)"
  bad_pattern: "raw = await client.messages.with_raw_response.create(...); message = raw.parse()"
  fix_pattern: "raw = await client.messages.with_raw_response.create(...); message = await raw.parse()"
repro:
  python: "3.13"
  deps: ["anthropic==1.0.0", "httpx2==2.13.0"]
  old_deps: ["anthropic==0.125.0", "httpx==0.28.1"]
provenance:
  sources:
    - {type: docs, url: "https://github.com/anthropics/anthropic-sdk-python/blob/v1.0.0/MIGRATION.md#with_raw_response-returns-the-new-response-classes"}
    - {type: changelog, url: "https://github.com/anthropics/anthropic-sdk-python/blob/v1.0.0/CHANGELOG.md"}
    - {type: other, url: "https://github.com/anthropics/anthropic-sdk-python/commit/33e296749dda59c3b9af85d9bee37ae241b92a28"}
