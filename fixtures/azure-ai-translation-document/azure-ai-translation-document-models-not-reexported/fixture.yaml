id: azure-ai-translation-document-models-not-reexported
title: "Importing DocumentTranslationInput/TranslationTarget from azure.ai.translation.document in 2.0"
summary: >
  azure-ai-translation-document 2.0 stopped re-exporting its models from the top-level
  package. `from azure.ai.translation.document import DocumentTranslationInput,
  TranslationTarget` (also TranslationGlossary, TranslationStatus, DocumentStatus,
  DocumentTranslationError, DocumentTranslationFileFormat, StorageInputType) raises
  ImportError; import them from azure.ai.translation.document.models. The clients stay at
  the top level.
ecosystem: python
package: azure-ai-translation-document
versions: ">=2.0.0"
tags: [azure, translation, import-path, migration]
failure:
  kind: api-renamed
  symptom: "ImportError: cannot import name 'DocumentTranslationInput' from 'azure.ai.translation.document'"
  bad_pattern: "from azure.ai.translation.document import DocumentTranslationInput, TranslationTarget"
  fix_pattern: "from azure.ai.translation.document.models import DocumentTranslationInput, TranslationTarget"
repro:
  python: "3.13"
  deps: ["azure-ai-translation-document==2.0.0", "azure-core==1.38.0", "isodate==0.7.2", "requests==2.32.5"]
  old_deps: ["azure-ai-translation-document==1.1.0", "azure-core==1.38.0", "isodate==0.7.2", "requests==2.32.5"]
provenance:
  sources:
    - {type: changelog, url: "https://github.com/Azure/azure-sdk-for-python/blob/azure-ai-translation-document_2.0.0/sdk/translation/azure-ai-translation-document/CHANGELOG.md"}
    - {type: other, url: "https://github.com/Azure/azure-sdk-for-python/blob/azure-ai-translation-document_2.0.0/sdk/translation/azure-ai-translation-document/azure/ai/translation/document/__init__.py"}
  license: "MIT"
  released: "2026-08-01"
status: verified
