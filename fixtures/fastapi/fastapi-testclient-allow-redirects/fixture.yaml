id: fastapi-testclient-allow-redirects
title: "Using requests-style allow_redirects= with the httpx-based TestClient"
summary: >
  Since Starlette 0.21 / FastAPI 0.87 the TestClient is built on HTTPX instead of
  requests. HTTPX names the option follow_redirects, so requests-style
  client.get(url, allow_redirects=False) raises TypeError.
ecosystem: python
package: fastapi
versions: ">=0.87.0"
tags: [testing, testclient, httpx, redirects, migration]
failure:
  kind: signature-changed
  symptom: "TypeError: TestClient.get() got an unexpected keyword argument 'allow_redirects'. Did you mean 'follow_redirects'?"
  bad_pattern: "client.get(\"/path\", allow_redirects=False)"
  fix_pattern: "client.get(\"/path\", follow_redirects=False)"
repro:
  python: "3.13"
  deps: ["fastapi==0.143.0", "starlette==1.6.0", "httpx2==2.13.0"]
  old_python: "3.11"
  old_deps: ["fastapi==0.86.0", "starlette==0.20.4", "pydantic==1.10.26", "anyio==3.7.1", "requests==2.32.3"]
provenance:
  sources:
    - {type: changelog, url: "https://fastapi.tiangolo.com/release-notes/#0870-2022-11-13"}
    - {type: other, url: "https://github.com/encode/starlette/discussions/1871"}
    - {type: other, url: "https://pypi.org/project/bump-testclient/"}
  license: "MIT"
  released: "2022-11-13"
status: verified
